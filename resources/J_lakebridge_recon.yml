variables:
  config_path:
    description: "Path to recon config CSV file"
    default: file:/Workspace/Users/aradhana.dubey@diggibyte.com/files/config/recon_config.csv

targets:
  dev:
    variables:
      config_path: file:/Workspace/Users/aradhana.dubey@diggibyte.com/files/config/recon_config.csv
  
  #prod:
    #variables:
      #config_path: /Volumes/learning_lab_catalog/lakebridge_recon/config/recon_config.csv

resources:
  jobs:
    PL_Lakebridge_Recon:
      name: PL_Lakebridge_Recon_${bundle.target}
      
      permissions:
        - level: CAN_MANAGE
          user_name: aradhana.dubey@diggibyte.com
      
      schedule:
        quartz_cron_expression: "14 0 0 * * ?"
        timezone_id: "Asia/Calcutta"
        pause_status: PAUSED

      tasks:
        - task_key: lakebridge_recon_config
          existing_cluster_id: "0422-125216-1t83bm6v"

          notebook_task:
            notebook_path: /Workspace/Users/aradhana.dubey@diggibyte.com/.bundle/recon-bundle/${bundle.target}/files/notebooks/NB_recon_config
            base_parameters:
              config_path: ${var.config_path}
              target_env: "${bundle.target}"

          timeout_seconds: 600

        - task_key: lakebridge_recon_foreach
          depends_on:
            - task_key: lakebridge_recon_config
          run_if: ALL_SUCCESS

          for_each_task:
            inputs: "{{tasks.lakebridge_recon_config.values.recon_config}}"
            concurrency: 3
            
            task:
              task_key: lakebridge_recon_runner
              existing_cluster_id: "0422-125216-1t83bm6v"

              notebook_task:
                notebook_path: /Workspace/Users/aradhana.dubey@diggibyte.com/.bundle/recon-bundle/${bundle.target}/files/notebooks/NB_Recon_Runner.ipynb
                base_parameters:
                  table_config: "{{input}}"
                  target_env: "${bundle.target}"

              timeout_seconds: 3600