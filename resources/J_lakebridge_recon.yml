resources:
  jobs:
    PL_Lakebridge_Recon:
      name: PL_Lakebridge_Recon_${bundle.target}

      permissions:
        - level: CAN_MANAGE
          user_name: aradhana.dubey@diggibyte.com

      schedule:
        quartz_cron_expression: "14 0 0 * * ?"
        timezone_id: "Asia/Calcutta"
        pause_status: PAUSED

      tasks:
        - task_key: lakebridge_recon_config
          existing_cluster_id: "0422-125216-1t83bm6v"

          notebook_task:
            # FIX: Use dynamic root_path and remove '/files/'
            notebook_path: ${workspace.root_path}/notebooks/NB_recon_config.ipynb
            base_parameters:
              # FIX: Use dynamic root_path here too
              config_path: ${workspace.root_path}/config/recon_config.csv
              target_env: "${bundle.target}"

          timeout_seconds: 600

        - task_key: lakebridge_recon_foreach
          depends_on:
            - task_key: lakebridge_recon_config
          run_if: ALL_SUCCESS

          for_each_task:
            inputs: "{{tasks.lakebridge_recon_config.values.recon_config}}"
            concurrency: 3
            
            task:
              task_key: lakebridge_recon_runner
              existing_cluster_id: "0422-125216-1t83bm6v"

              notebook_task:
                # FIX: Use dynamic root_path
                notebook_path: ${workspace.root_path}/notebooks/NB_recon_runner.ipynb
                base_parameters:
                  table_config: "{{input}}"
                  target_env: "${bundle.target}"

              timeout_seconds: 3600