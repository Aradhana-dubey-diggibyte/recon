name: Deploy Databricks Bundle (Dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Databricks CLI
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.220.0

      # 3. Validate and deploy bundle to DEV
      - name: Deploy bundle to dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate
          databricks bundle deploy -t dev --force
      - name: Verify deployed files
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Listing deployed files..."
          databricks workspace ls "/Workspace/Users/aradhana.dubey@diggibyte.com/.bundle/recon-bundle/dev/files/config/" || echo "❌ Config folder NOT found!"
