bundle:
  name: recon-bundle
  
sync:
  exclude:
    - config/recon_config.csv

include:
  - resources/*.yml
  - notebooks/*.ipynb

sync:
  include:
    - notebooks/*.ipynb
    

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
