bundle:
  name: recon-bundle
include:
  - resources/*.yml
permissions:
        - level: CAN_MANAGE
          group_name: users 
sync:
  include:
    - notebooks/*
    - config/*.csv

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}/${workspace.current_user.userName}
