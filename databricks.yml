bundle:
  name: recon-bundle

# DO NOT include resources manually
# Databricks auto-loads everything under resources/
#include:
   #- resources/*.yml  

# Control what gets synced to the workspace
sync:
  include:
    - notebooks/*.ipynb
    - resources/**.yml
    - config/*.csv

targets:
  dev:
    mode: development
    default: true
    
  workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
