bundle:
  name: recon-bundle
include:
  - resources/*.yml

# Control what gets synced to the workspace
sync:
  include:
    - notebooks/**
    - resources/**
    - config/*.csv

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://adb-7488500312027058.18.azuredatabricks.net
      profile: DEFAULT
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
